<style>
  :root {
    --pink:        #ff3d7f;
    --magenta:     #ff1e9c;
    --orange:      #ff8c42;
    --yellow:      #ffd23f;
    --teal:        #00d9c0;
    --cyan:        #4ecdc4;
    --purple:      #7b2cbf;
    --deep:        #0a1f44;
    --night:       #06122e;
    --paper:       #fff5e6;
    --paper-soft:  #ffeed1;
    --ink:         #0a1f44;
    --shadow:      0 4px 0 #0a1f44;
    --shadow-lg:   0 8px 0 #0a1f44;

    /* Premium system font stacks - guaranteed offline on every device */
    --font-display: ui-serif, "New York", "Iowan Old Style", "Apple Garamond", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --font-body:    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono:    ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  body {
    background:
      radial-gradient(ellipse at top left, rgba(255,61,127,.18), transparent 50%),
      radial-gradient(ellipse at top right, rgba(0,217,192,.20), transparent 50%),
      radial-gradient(ellipse at bottom, rgba(255,210,63,.14), transparent 60%),
      var(--paper);
    background-attachment: fixed;
    padding-bottom: 140px;
    padding-bottom: max(140px, env(safe-area-inset-bottom, 0px));
  }

  /* SVG grain texture - inline, no external request */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
    opacity: 0.15;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 0;
    padding-top: max(24px, env(safe-area-inset-top, 0px));
  }

  /* ===== HEADER ===== */
  header {
    position: relative;
    padding: 20px 0 28px;
    text-align: center;
  }

  .palm {
    position: absolute;
    font-size: 38px;
    line-height: 1;
    filter: drop-shadow(2px 2px 0 var(--ink));
  }
  .palm.left { top: 14px; left: 4px; transform: rotate(-14deg); }
  .palm.right { top: 14px; right: 4px; transform: rotate(14deg) scaleX(-1); }

  .sub {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--pink);
    margin-bottom: 10px;
    font-weight: 600;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(54px, 16vw, 78px);
    line-height: 0.88;
    letter-spacing: -0.04em;
    text-transform: uppercase;
    font-style: italic;
    background: linear-gradient(180deg, var(--pink) 0%, var(--orange) 55%, var(--yellow) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--pink); /* fallback */
    filter: drop-shadow(3px 3px 0 var(--ink));
    margin-bottom: 8px;
  }

  .tagline {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 15px;
    color: var(--ink);
    opacity: 0.7;
    letter-spacing: 0.01em;
  }

  .offline-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 5px 12px;
    background: rgba(0, 217, 192, 0.15);
    border: 1.5px solid rgba(0, 217, 192, 0.45);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #008577;
    font-weight: 600;
  }
  .offline-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
  }

  /* ===== TOTALS CARD ===== */
  .totals {
    background: var(--night);
    border: 3px solid var(--ink);
    border-radius: 24px;
    padding: 24px 22px;
    color: var(--paper);
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .totals::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 220px;
    height: 220px;
    background: radial-gradient(circle, var(--pink), transparent 70%);
    opacity: 0.45;
    border-radius: 50%;
    pointer-events: none;
  }
  .totals::after {
    content: '';
    position: absolute;
    bottom: -40%;
    left: -20%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, var(--teal), transparent 70%);
    opacity: 0.35;
    border-radius: 50%;
    pointer-events: none;
  }

  .totals-inner { position: relative; z-index: 2; }

  .totals-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--yellow);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .total-amount {
    font-family: var(--font-display);
    font-weight: 800;
    font-style: italic;
    font-size: clamp(48px, 14vw, 64px);
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--paper);
    margin-bottom: 18px;
  }

  .total-amount .cents {
    font-size: 0.5em;
    opacity: 0.55;
    font-weight: 600;
  }

  .totals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px dashed rgba(255,245,230,0.25);
  }

  .stat {
    text-align: left;
  }
  .stat-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .stat-value {
    font-family: var(--font-display);
    font-weight: 700;
    font-style: italic;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  .stat-value.accent { color: var(--teal); }
  .stat-value.warm { color: var(--orange); }

  /* ===== BUDGET BAR ===== */
  .budget-section {
    margin-top: 20px;
  }
  .budget-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--font-mono);
    font-size: 11px;
    margin-bottom: 8px;
  }
  .budget-row .left {
    opacity: 0.85;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .budget-row .right {
    color: var(--yellow);
    font-weight: 500;
  }

  .budget-bar {
    height: 10px;
    background: rgba(255,245,230,0.15);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .budget-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--yellow), var(--orange), var(--pink));
    border-radius: 6px;
    transition: width 0.5s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 0 12px rgba(255,210,63,0.4);
    min-width: 0;
  }
  .budget-fill.over {
    background: linear-gradient(90deg, var(--pink), var(--magenta));
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .budget-edit {
    background: none;
    border: none;
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 11px;
    text-decoration: underline;
    cursor: pointer;
    opacity: 0.75;
    padding: 0;
    font-weight: 500;
  }
  .budget-edit:hover { opacity: 1; color: var(--yellow); }

  /* ===== CATEGORY FILTERS ===== */
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 4px 14px;
    margin: 0 -4px 8px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .filters::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    padding: 9px 14px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    color: var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    box-shadow: 2px 2px 0 var(--ink);
    white-space: nowrap;
  }
  .chip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .chip.active {
    background: var(--ink);
    color: var(--yellow);
  }
  .chip .count {
    opacity: 0.5;
    margin-left: 5px;
    font-weight: 400;
  }
  .chip.active .count { color: var(--teal); opacity: 1; }

  /* ===== EXPENSES LIST ===== */
  .section-title {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.5;
    margin: 16px 4px 12px;
    display: flex;
    justify-content: space-between;
    font-weight: 600;
  }

  .expense-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .expense {
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: 16px;
    padding: 14px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    position: relative;
    animation: slideIn 0.3s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cat-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }

  .exp-details {
    flex: 1;
    min-width: 0;
  }
  .exp-title {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    line-height: 1.25;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .exp-meta {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    opacity: 0.55;
    text-transform: uppercase;
    font-weight: 600;
  }

  .exp-amount {
    font-family: var(--font-display);
    font-weight: 700;
    font-style: italic;
    font-size: 19px;
    color: var(--ink);
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--ink);
    opacity: 0.3;
    cursor: pointer;
    font-size: 22px;
    padding: 4px 0 4px 6px;
    line-height: 1;
    font-family: var(--font-body);
    font-weight: 300;
    flex-shrink: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  .delete-btn:hover, .delete-btn:active { opacity: 1; color: var(--magenta); }

  /* ===== EMPTY STATE ===== */
  .empty {
    text-align: center;
    padding: 50px 20px 30px;
    color: var(--ink);
  }
  .empty-emoji {
    font-size: 56px;
    margin-bottom: 14px;
    filter: drop-shadow(2px 2px 0 var(--ink));
  }
  .empty-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-style: italic;
    font-size: 24px;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }
  .empty-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.5;
    font-weight: 600;
  }

  /* ===== UTILITY ROW ===== */
  .utility-row {
    display: flex;
    gap: 8px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px dashed rgba(10, 31, 68, 0.15);
  }
  .util-btn {
    flex: 1;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 11px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s, color 0.12s;
    color: var(--ink);
    font-weight: 600;
  }
  .util-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .util-btn.danger:hover { background: var(--pink); color: var(--paper); }

  /* ===== FAB ===== */
  .fab {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 24px;
    bottom: max(24px, env(safe-area-inset-bottom, 0px));
    z-index: 50;
    background: var(--pink);
    color: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 15px 26px;
    font-family: var(--font-display);
    font-weight: 800;
    font-style: italic;
    font-size: 17px;
    letter-spacing: -0.01em;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
  }
  .fab:hover { background: var(--magenta); }
  .fab:active {
    transform: translateX(-50%) translateY(4px);
    box-shadow: 0 4px 0 var(--ink);
  }
  .fab .plus {
    font-size: 24px;
    line-height: 1;
    font-weight: 400;
    font-family: var(--font-body);
    font-style: normal;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 18, 46, 0.6);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 28px 28px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 20px 20px 32px;
    padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
    border-bottom: none;
    animation: slideUp 0.3s cubic-bezier(.2,.8,.2,1);
    -webkit-overflow-scrolling: touch;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 48px;
    height: 5px;
    background: var(--ink);
    opacity: 0.2;
    border-radius: 3px;
    margin: 0 auto 18px;
  }

  .modal-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-style: italic;
    font-size: 32px;
    color: var(--ink);
    margin-bottom: 4px;
    text-align: center;
    letter-spacing: -0.03em;
  }
  .modal-sub {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 14px;
    opacity: 0.6;
    margin-bottom: 22px;
    text-align: center;
  }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 6px;
    opacity: 0.7;
    font-weight: 600;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field input[type="date"] {
    width: 100%;
    padding: 14px 16px;
    background: var(--paper-soft);
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    font-family: var(--font-body);
    font-size: 16px; /* 16px prevents iOS zoom on focus */
    color: var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    -webkit-appearance: none;
    appearance: none;
    font-weight: 500;
  }
  .field input:focus {
    outline: none;
    background: var(--paper);
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
  }

  .amount-input {
    position: relative;
  }
  .amount-input::before {
    content: '$';
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-display);
    font-weight: 800;
    font-style: italic;
    font-size: 24px;
    color: var(--pink);
    z-index: 1;
    pointer-events: none;
    line-height: 1;
  }
  .amount-input input {
    padding-left: 36px !important;
    font-family: var(--font-display) !important;
    font-style: italic !important;
    font-weight: 700 !important;
    font-size: 24px !important;
    letter-spacing: -0.02em;
  }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .cat-option {
    aspect-ratio: 1;
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    background: var(--paper-soft);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px 4px;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
    font-family: inherit;
    color: inherit;
  }
  .cat-option:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  .cat-option.selected {
    background: var(--ink);
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 var(--ink);
  }
  .cat-option .emoji { font-size: 24px; line-height: 1; }
  .cat-option .name {
    font-family: var(--font-mono);
    font-size: 8.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.1;
    font-weight: 600;
  }
  .cat-option.selected .name { color: var(--yellow); }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    font-family: var(--font-display);
    font-weight: 800;
    font-style: italic;
    font-size: 16px;
    letter-spacing: -0.01em;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .btn-cancel { background: var(--paper); color: var(--ink); }
  .btn-save { background: var(--pink); color: var(--paper); }
  .btn-save:hover { background: var(--magenta); }
  .btn-save:disabled {
    background: var(--paper-soft);
    color: var(--ink);
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: var(--shadow);
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 100px;
    bottom: max(100px, calc(env(safe-area-inset-bottom, 0px) + 76px));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 20px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 200;
    box-shadow: 0 6px 0 rgba(0,0,0,0.2);
    white-space: nowrap;
    max-width: calc(100vw - 40px);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Improve focus visibility for keyboard users */
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--pink);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <span class="palm left" aria-hidden="true">🌴</span>
    <span class="palm right" aria-hidden="true">🌴</span>
    <div class="sub">Trip · Tracker</div>
    <h1>Miami<br/>Money</h1>
    <div class="tagline">every dollar, sun-soaked &amp; accounted for</div>
    <div class="offline-badge"><span class="offline-dot"></span>Saves On Your Device</div>
  </header>

  <!-- TOTALS CARD -->
  <div class="totals">
    <div class="totals-inner">
      <div class="totals-label">Total Spent</div>
      <div class="total-amount" id="totalAmount">$0<span class="cents">.00</span></div>

      <div class="budget-section">
        <div class="budget-row">
          <span class="left">Budget</span>
          <span class="right"><span id="budgetUsed">set a budget →</span> · <button class="budget-edit" id="setBudgetBtn">edit</button></span>
        </div>
        <div class="budget-bar">
          <div class="budget-fill" id="budgetFill" style="width:0%"></div>
        </div>
      </div>

      <div class="totals-grid">
        <div class="stat">
          <div class="stat-label">Transactions</div>
          <div class="stat-value accent" id="txCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Daily Avg</div>
          <div class="stat-value warm" id="dailyAvg">$0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters" id="filters"></div>

  <!-- LIST -->
  <div class="section-title">
    <span>Recent</span>
    <span id="visibleCount">0 items</span>
  </div>
  <div class="expense-list" id="expenseList"></div>

  <!-- UTILITY ROW -->
  <div class="utility-row">
    <button class="util-btn" id="exportBtn">⬇ Export CSV</button>
    <button class="util-btn danger" id="clearBtn">⌫ Clear All</button>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="addFab" aria-label="Add expense">
  <span class="plus" aria-hidden="true">+</span>
  <span>Add Expense</span>
</button>

<!-- TOAST -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">New Expense</div>
    <div class="modal-sub">what'd you spend on?</div>

    <div class="field">
      <label for="inputAmount">Amount</label>
      <div class="amount-input">
        <input type="number" id="inputAmount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" autocomplete="off" />
      </div>
    </div>

    <div class="field">
      <label for="inputTitle">What was it?</label>
      <input type="text" id="inputTitle" placeholder="e.g. Cuban sandwich at Versailles" maxlength="60" autocomplete="off" />
    </div>

    <div class="field">
      <label>Category</label>
      <div class="cat-grid" id="catGrid"></div>
    </div>

    <div class="field">
      <label for="inputDate">Date</label>
      <input type="date" id="inputDate" />
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-cancel" id="cancelBtn">Cancel</button>
      <button type="button" class="btn btn-save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  /* ============================================================
     STORAGE LAYER
     Uses localStorage (works offline, persists across sessions,
     available in 100% of modern browsers).
     ============================================================ */
  const STORAGE_KEY = 'miami_expenses_v1';
  const BUDGET_KEY  = 'miami_budget_v1';

  // Test localStorage actually works (Safari private mode used to break it)
  let storageWorks = true;
  try {
    const t = '__test__';
    localStorage.setItem(t, t);
    localStorage.removeItem(t);
  } catch (e) {
    storageWorks = false;
  }

  // In-memory fallback if storage breaks
  const memStore = {};
  function storeGet(k) {
    try { return storageWorks ? localStorage.getItem(k) : memStore[k] || null; }
    catch (e) { return memStore[k] || null; }
  }
  function storeSet(k, v) {
    try {
      if (storageWorks) localStorage.setItem(k, v);
      else memStore[k] = v;
    } catch (e) { memStore[k] = v; }
  }

  /* ============================================================
     STATE
     ============================================================ */
  let expenses = [];
  let budget = 0;
  let activeFilter = 'all';
  let selectedCat = 'food';

  const CATEGORIES = [
    { id: 'food',    name: 'Food',    emoji: '🥑', color: '#ff8c42' },
    { id: 'drinks',  name: 'Drinks',  emoji: '🍹', color: '#ff3d7f' },
    { id: 'hotel',   name: 'Hotel',   emoji: '🏨', color: '#7b2cbf' },
    { id: 'transit', name: 'Transit', emoji: '🚖', color: '#ffd23f' },
    { id: 'beach',   name: 'Beach',   emoji: '🏖️', color: '#00d9c0' },
    { id: 'fun',     name: 'Fun',     emoji: '🎉', color: '#ff1e9c' },
    { id: 'shop',    name: 'Shop',    emoji: '🛍️', color: '#4ecdc4' },
    { id: 'other',   name: 'Other',   emoji: '💸', color: '#0a1f44' },
  ];

  const catById = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[7];

  /* ============================================================
     LOAD / SAVE
     ============================================================ */
  function loadData() {
    try {
      const e = storeGet(STORAGE_KEY);
      if (e) {
        const parsed = JSON.parse(e);
        // Validate shape
        if (Array.isArray(parsed)) {
          expenses = parsed.filter(x =>
            x && typeof x === 'object' &&
            typeof x.amount === 'number' && isFinite(x.amount) &&
            typeof x.id === 'string'
          );
        }
      }
      const b = storeGet(BUDGET_KEY);
      if (b) {
        const v = parseFloat(b);
        if (isFinite(v) && v >= 0) budget = v;
      }
    } catch (err) {
      console.warn('Load failed:', err);
      expenses = [];
      budget = 0;
    }
  }

  function saveExpenses() {
    try { storeSet(STORAGE_KEY, JSON.stringify(expenses)); }
    catch (err) { console.warn('Save failed:', err); showToast('⚠ Could not save'); }
  }

  function saveBudget() {
    try { storeSet(BUDGET_KEY, String(budget)); }
    catch (err) { console.warn('Save failed:', err); }
  }

  /* ============================================================
     UTILITIES
     ============================================================ */
  function formatMoney(n) {
    return '$' + Number(n).toLocaleString('en-US', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function formatDateShort(d) {
    if (!d) return '';
    try {
      const dt = new Date(d + 'T00:00:00');
      if (isNaN(dt.getTime())) return d;
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    } catch (e) { return d; }
  }

  function todayIso() {
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().split('T')[0];
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ============================================================
     RENDER
     ============================================================ */
  function renderFilters() {
    const counts = { all: expenses.length };
    CATEGORIES.forEach(c => {
      counts[c.id] = expenses.filter(e => e.cat === c.id).length;
    });

    const fc = document.getElementById('filters');
    const items = [{ id: 'all', name: 'All', emoji: '✨' }, ...CATEGORIES];
    fc.innerHTML = items.map(c => `
      <button class="chip ${activeFilter === c.id ? 'active' : ''}" data-cat="${c.id}" type="button">
        ${c.emoji} ${c.name}<span class="count">${counts[c.id] || 0}</span>
      </button>
    `).join('');
    fc.querySelectorAll('.chip').forEach(el => {
      el.addEventListener('click', () => {
        activeFilter = el.dataset.cat;
        renderAll();
      });
    });
  }

  function renderTotals() {
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    const dollars = Math.floor(total);
    const cents = (total - dollars).toFixed(2).slice(2);
    document.getElementById('totalAmount').innerHTML =
      '$' + dollars.toLocaleString('en-US') + `<span class="cents">.${cents}</span>`;

    document.getElementById('txCount').textContent = expenses.length;

    const uniqueDays = new Set(expenses.map(e => e.date)).size || 1;
    const avg = expenses.length ? total / uniqueDays : 0;
    document.getElementById('dailyAvg').textContent = formatMoney(avg);

    const fill = document.getElementById('budgetFill');
    const used = document.getElementById('budgetUsed');
    if (budget > 0) {
      const pct = Math.min(100, (total / budget) * 100);
      const overBudget = total > budget;
      fill.style.width = pct + '%';
      fill.classList.toggle('over', overBudget);
      used.textContent = overBudget
        ? `OVER by ${formatMoney(total - budget)}`
        : `${formatMoney(total)} / ${formatMoney(budget)}`;
    } else {
      fill.style.width = '0%';
      fill.classList.remove('over');
      used.textContent = 'set a budget →';
    }
  }

  function renderList() {
    const filtered = activeFilter === 'all'
      ? expenses.slice()
      : expenses.filter(e => e.cat === activeFilter);

    // Sort: newest date first, then newest id (id contains timestamp)
    filtered.sort((a, b) => {
      const d = (b.date || '').localeCompare(a.date || '');
      if (d !== 0) return d;
      return (b.id || '').localeCompare(a.id || '');
    });

    document.getElementById('visibleCount').textContent =
      filtered.length + (filtered.length === 1 ? ' item' : ' items');

    const list = document.getElementById('expenseList');
    if (filtered.length === 0) {
      const msg = activeFilter === 'all'
        ? { title: 'Nothing logged yet', sub: 'tap + to add your first' }
        : { title: 'Nothing here', sub: 'no expenses in this category' };
      list.innerHTML = `
        <div class="empty">
          <div class="empty-emoji" aria-hidden="true">🌅</div>
          <div class="empty-title">${msg.title}</div>
          <div class="empty-sub">${msg.sub}</div>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map(e => {
      const c = catById(e.cat);
      const dateStr = formatDateShort(e.date);
      return `
        <div class="expense">
          <div class="cat-icon" style="background:${c.color}22;" aria-hidden="true">${c.emoji}</div>
          <div class="exp-details">
            <div class="exp-title">${escapeHtml(e.title || c.name)}</div>
            <div class="exp-meta">${escapeHtml(c.name)} · ${escapeHtml(dateStr)}</div>
          </div>
          <div class="exp-amount">${formatMoney(e.amount)}</div>
          <button class="delete-btn" data-id="${escapeHtml(e.id)}" aria-label="Delete expense" type="button">×</button>
        </div>
      `;
    }).join('');

    list.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteExpense(btn.dataset.id));
    });
  }

  function renderAll() {
    renderFilters();
    renderTotals();
    renderList();
  }

  /* ============================================================
     MODAL
     ============================================================ */
  function openModal() {
    document.getElementById('modal').classList.add('show');
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputDate').value = todayIso();
    selectedCat = 'food';
    renderCatGrid();
    // Prevent body scroll when modal is open
    document.body.style.overflow = 'hidden';
    setTimeout(() => {
      const amt = document.getElementById('inputAmount');
      if (amt) amt.focus();
    }, 120);
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
    document.body.style.overflow = '';
  }

  function renderCatGrid() {
    const grid = document.getElementById('catGrid');
    grid.innerHTML = CATEGORIES.map(c => `
      <button type="button" class="cat-option ${selectedCat === c.id ? 'selected' : ''}" data-cat="${c.id}">
        <div class="emoji" aria-hidden="true">${c.emoji}</div>
        <div class="name">${c.name}</div>
      </button>
    `).join('');
    grid.querySelectorAll('.cat-option').forEach(el => {
      el.addEventListener('click', () => {
        selectedCat = el.dataset.cat;
        renderCatGrid();
      });
    });
  }

  function saveExpense() {
    const amtEl = document.getElementById('inputAmount');
    const titleEl = document.getElementById('inputTitle');
    const dateEl = document.getElementById('inputDate');

    const amount = parseFloat(amtEl.value);
    const title = titleEl.value.trim();
    const date = dateEl.value || todayIso();

    if (!isFinite(amount) || amount <= 0) {
      amtEl.focus();
      showToast('⚠ Enter a valid amount');
      return;
    }

    expenses.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      amount: Math.round(amount * 100) / 100, // round to cents
      title: title || catById(selectedCat).name,
      cat: selectedCat,
      date: date,
    });

    saveExpenses();
    closeModal();
    renderAll();
    showToast('✓ Expense added');
  }

  function deleteExpense(id) {
    const before = expenses.length;
    expenses = expenses.filter(e => e.id !== id);
    if (expenses.length !== before) {
      saveExpenses();
      renderAll();
      showToast('✓ Deleted');
    }
  }

  function setBudget() {
    const cur = budget > 0 ? String(budget) : '';
    const input = window.prompt('Trip budget in USD?\n(Set 0 to remove)', cur);
    if (input === null) return;
    const val = parseFloat(input);
    budget = (isFinite(val) && val > 0) ? val : 0;
    saveBudget();
    renderTotals();
    showToast(budget > 0 ? '✓ Budget set' : '✓ Budget cleared');
  }

  function exportCsv() {
    if (expenses.length === 0) {
      showToast('⚠ Nothing to export');
      return;
    }
    const header = 'Date,Category,Description,Amount\n';
    const rows = expenses
      .slice()
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
      .map(e => {
        const safeTitle = '"' + String(e.title || '').replace(/"/g, '""') + '"';
        const cat = catById(e.cat).name;
        return `${e.date},${cat},${safeTitle},${e.amount.toFixed(2)}`;
      })
      .join('\n');
    const csv = header + rows + '\n';

    try {
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `miami-expenses-${todayIso()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 100);
      showToast('✓ Exported CSV');
    } catch (err) {
      console.warn('Export failed:', err);
      showToast('⚠ Export failed');
    }
  }

  function clearAll() {
    if (expenses.length === 0) {
      showToast('Already empty');
      return;
    }
    const ok = window.confirm(`Delete all ${expenses.length} expense${expenses.length === 1 ? '' : 's'}?\n\nThis cannot be undone.`);
    if (!ok) return;
    expenses = [];
    saveExpenses();
    renderAll();
    showToast('✓ All cleared');
  }

  /* ============================================================
     WIRE UP
     ============================================================ */
  document.getElementById('addFab').addEventListener('click', openModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', saveExpense);
  document.getElementById('setBudgetBtn').addEventListener('click', setBudget);
  document.getElementById('exportBtn').addEventListener('click', exportCsv);
  document.getElementById('clearBtn').addEventListener('click', clearAll);

  // Close modal on backdrop click (but not when clicking inside the modal)
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') closeModal();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('modal').classList.contains('show')) closeModal();
    }
    // Enter in inputs (not textarea) saves the form
    if (e.key === 'Enter' && document.getElementById('modal').classList.contains('show')) {
      if (e.target.tagName === 'INPUT') {
        e.preventDefault();
        saveExpense();
      }
    }
  });

  // Warn if storage is unavailable
  if (!storageWorks) {
    setTimeout(() => showToast('⚠ Private mode - data won\'t save'), 800);
  }

  /* ============================================================
     INIT
     ============================================================ */
  loadData();
  renderAll();
})();
</script>
</body>
</html>
